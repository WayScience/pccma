name: pccma_atlas_preprocessing_env
channels:
  - conda-forge
dependencies:
  - conda-forge::python=3.11
  - conda-forge::jupyter=1.0.0
  - conda-forge::pip
  - conda-forge::tifffile
  - conda-forge::jupyterlab
  - conda-forge::pandas
  - conda-forge::ipykernel
  - conda-forge::nb_conda_kernels
  - conda-forge::scipy
  - conda-forge::numpy
  - conda-forge::scikit-learn
  - conda-forge::seaborn
  - conda-forge::umap-learn
  - conda-forge::matplotlib
  - conda-forge::papermill
  - conda-forge::tabulate
  - pip:
    - Cytotable
    - coSMicQC>=0.1.0
    - cytodataframe>=0.3.3
    - dask[dataframe]
    # pycytominer is pure Python, so install it via
    # pip instead to get the current release (no conflicts)
    - pycytominer==1.7.1
