# uv environment for the profile processing modules (4.preprocess_features and the processing
# notebook of 5.morphem_featurization). It replaces the pccma_atlas_preprocessing_env conda environment.
#
# Create or update the environment (from this folder): uv sync --locked
# Activate it: source environments/preprocessing/.venv/bin/activate
#
# The direct dependencies are pinned to the versions of the conda environment, and every other package
# is constrained to the version from that environment (pip list --format=freeze), so we keep the same
# versions after moving to uv.
[project]
name = "pccma-atlas-preprocessing"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "pycytominer==1.7.1",
    "cytotable==1.2.6",
    "cosmicqc==1.1.2",
    "cytodataframe==0.3.6",
    "dask[dataframe]==2026.8.0",
    "pandas==2.2.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
    "matplotlib==3.11.2",
    "umap-learn==0.5.12",
    "tifffile==2026.3.3",
    "pyarrow==22.0.0",
    "pyyaml==6.0.3",
    "tabulate==0.10.0",
    "papermill==2.7.0",
    "jupyter==1.0.0",
    "jupyterlab==4.6.4",
    "ipykernel==7.4.0",
    "nbconvert==7.17.2",
]

[tool.uv]
package = false
# use a Python that uv manages instead of one from a conda environment
python-preference = "only-managed"
