# This is the configuration file for all plates regardless of reimaging status.
# We are using the channel names and not channel IDs, which means that regardless
# of the channel ID number, the names will keep the LoadData CSVs consistent.
# NOTE: We do not include brightfield channel(s) in the image analysis pipeline.
channels:
    Alexa 488: OrigER
    Alexa 568: OrigAGP
    Alexa 647: OrigMito
    HOECHST 33342: OrigDNA
    Alexa 488 Long (CP): OrigRNA

metadata:
    Row: Row
    Col: Col
    FieldID: FieldID
    PlaneID: PlaneID
    ChannelID: ChannelID
    ChannelName: ChannelName
    ImageResolutionX: ImageResolutionX
    ImageResolutionY: ImageResolutionY
    ImageSizeX: ImageSizeX
    ImageSizeY: ImageSizeY
    BinningX: BinningX
    BinningY: BinningY
    MaxIntensity: MaxIntensity
    PositionX: PositionX
    PositionY: PositionY
    PositionZ: PositionZ
    AbsPositionZ: AbsPositionZ
    AbsTime: AbsTime
    MainExcitationWavelength: MainExcitationWavelength
    MainEmissionWavelength: MainEmissionWavelength
    ObjectiveMagnification: ObjectiveMagnification
    ObjectiveNA: ObjectiveNA
    ExposureTime: ExposureTime
