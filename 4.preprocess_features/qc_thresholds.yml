# Thresholds (z-scores) for single-cell quality control with coSMicQC (1.sc_quality_control.ipynb).
# The z-scores are calculated per cell line across all plates (time points).

# Thresholds used for every cell line unless the cell line overrides a condition below
default:
  # clustered nuclei (high mass displacement and high intensity)
  clustered_nuclei:
    Nuclei_Intensity_MassDisplacement_DNA: 0.1  # Set very low as to detect all instances of clustering nuclei
    Nuclei_Intensity_IntegratedIntensity_DNA: 1.5  # Set higher than displacement to avoid false positives
  # very irregular shaped nuclei (low solidity), likely indicating mis-segmentation
  low_solidity_nuclei:
    Nuclei_AreaShape_Solidity: -2.0
  # cells that contain multiple nuclei (high DNA intensity in the cell)
  cells_multiple_nuclei:
    Cells_Intensity_IntegratedIntensity_DNA: 3.0  # Set high to only remove the most extreme cells for better quality cell lines

# Conditions that differ from the default per cell line (only add after reviewing the example outliers).
# Overriding a condition replaces all of its thresholds, e.g.:
#   COGEP280:
#     cells_multiple_nuclei:
#       Cells_Intensity_IntegratedIntensity_DNA: 2.5  # reason for the change
cell_lines:
  A673:
    cells_multiple_nuclei:
      Cells_Intensity_IntegratedIntensity_DNA: 0.5  # stricter: very small nuclei, so more merged nuclei that were excluded from segmentation
  CHLA10:
    low_solidity_nuclei:
      Nuclei_AreaShape_Solidity: -0.5  # stricter: clustered nuclei lead to more irregular nuclei segmentations
    cells_multiple_nuclei:
      Cells_Intensity_IntegratedIntensity_DNA: 2.0  # stricter: clustered nuclei lead to more cells with multiple nuclei
  CHLA113:
    clustered_nuclei:
      Nuclei_Intensity_MassDisplacement_DNA: 1.0  # looser: default removed good quality nuclei
      Nuclei_Intensity_IntegratedIntensity_DNA: 2.0  # looser: default removed good quality nuclei
    cells_multiple_nuclei:
      Cells_Intensity_IntegratedIntensity_DNA: 1.0  # stricter: one extreme cell (z = 72) inflates the standard deviation, so the default barely flags any cells
  CHLA186:
    clustered_nuclei:
      Nuclei_Intensity_MassDisplacement_DNA: 0.05
      Nuclei_Intensity_IntegratedIntensity_DNA: 1.5  # stricter: default missed some clustered nuclei
    low_solidity_nuclei:
      Nuclei_AreaShape_Solidity: -0.5  # stricter: default missed some irregular nuclei
    cells_multiple_nuclei:
      Cells_Intensity_IntegratedIntensity_DNA: 0.8  # stricter: default missed some cells with multiple nuclei
  # NOTE: CHLA194 at 72 hours (BR00150703) might contain mycoplasma (small odd segmentations found in the outliers)
  CHLA194:
    low_solidity_nuclei:
      Nuclei_AreaShape_Solidity: -0.8  # stricter: non-optimal cell line with more irregular nuclei segmentations
    cells_multiple_nuclei:
      Cells_Intensity_IntegratedIntensity_DNA: 1.0  # stricter: non-optimal cell line with more cells with multiple nuclei
